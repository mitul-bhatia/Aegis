version: '3.8'

services:
  # 1. Aegis Backend API & Agent Orchestrator
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aegis
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # 2. Aegis Next.js 14 Web Frontend
  frontend:
    build:
      context: ./aegis-frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aegis
    ports:
      - "5432:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 4. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 5. Aegis Sandboxed Verification Runner (Built locally for zero-trust exploit testing)
  sandbox:
    build:
      context: ./backend/runner
      dockerfile: Dockerfile.sandbox
    container_name: aegis-sandbox
    profiles: ["tools"]

volumes:
  aegis_pgdata:
