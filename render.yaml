# Render Blueprint for Aegis Security System
# Deploys FastAPI Backend Web Service + Redis Background Worker
# Using native Python builds (env: python) — Dockerfiles are used locally only

services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: aegis-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: AUTO_FALLBACK_TO_DEMO
        value: "false"
      # Optional: Set if sandbox microservice is deployed to Fly.io
      - key: SANDBOX_SERVICE_URL
        sync: false
      - key: SANDBOX_API_KEY
        sync: false

  # 2. Redis Background Worker Node
  - type: worker
    name: aegis-worker
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python worker.py"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: AUTO_FALLBACK_TO_DEMO
        value: "false"
      - key: SANDBOX_SERVICE_URL
        sync: false
      - key: SANDBOX_API_KEY
        sync: false



